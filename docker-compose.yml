# OmniDesk — полный стек для локальной ВМ или VPS
#
# Запуск:
#   cp .env.example .env && chmod 600 .env
#   # заполнить секреты: openssl rand -base64 32
#   docker compose up -d
#   docker compose --profile tunnel up -d cloudflared   # публичный HTTPS
#
# ГЛАВНОЕ ПРАВИЛО ЭТОГО ФАЙЛА:
#   Postgres и Redis НЕ публикуют порты наружу. Docker пишет правила
#   в iptables ДО правил UFW — строка "ports: 5432:5432" откроет базу
#   в интернет, даже если `ufw status` показывает, что порт закрыт.
#
# Проверка снаружи, с другой машины:
#   nmap -Pn -p- ВАШ_IP     → только 22/80/443 или ничего
#   bash infra/scripts/security-check.sh

name: omnidesk

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # local = том Docker, s3 = Cloudflare R2 или совместимое.
  # Переключение драйвера не требует правок кода.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_PATH: /data/media
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-auto}
  # Приложение ходит под app_user, а НЕ под владельцем БД.
  # Владелец обходит политики RLS — под ним изоляция не работает.
  DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnidesk}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

networks:
  edge:
  internal:
    internal: true   # без выхода в интернет

volumes: { pgdata: , redisdata: , mediadata: , caddydata: , caddyconfig: }

services:
  postgres:
    image: postgres:17-alpine
    <<: *hardening
    networks: [internal]
    # Порт наружу НЕ публикуется. Для отладки с хоста — SSH-туннель:
    #   ssh -L 5432:127.0.0.1:5432 deploy@server
    # и раскомментировать строку ниже (обязательно с 127.0.0.1):
    # ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnidesk}
      POSTGRES_USER: ${POSTGRES_USER:-omnidesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD не задан}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты выполняются по алфавиту и ТОЛЬКО при первой инициализации:
      #   00-app-role.sh  — роль app_user
      #   01-rls-setup.sql — расширения и функция apply_tenant_rls
      #   02-schema.sql    — таблицы + изоляция + проверка целостности
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Тест изоляции монтируется ОТДЕЛЬНО и вне initdb.d — иначе он бы
      # выполнялся при инициализации базы как обычная миграция.
      - ./infra/postgres/test-isolation.sql:/opt/test-isolation.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=1GB           # ≈25% RAM ноды; на 4 GB ставьте 512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnidesk} -d ${POSTGRES_DB:-omnidesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    <<: *hardening
    networks: [internal]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
      - --maxmemory
      - 512mb
      # noeviction обязателен: для очередей BullMQ вытеснение означает
      # потерю задач, то есть потерю сообщений клиентов.
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Принимает вебхуки каналов. Проверяет подпись → очередь → 200.
  # Отделён от api намеренно: Messenger требует ответ за 20 секунд,
  # Meta ретраит до 7 дней при неуспехе.
  ingress:
    build: { context: ., dockerfile: apps/ingress/Dockerfile }
    <<: *hardening
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      <<: *app-env
      PORT: 3001
      META_APP_SECRET: ${META_APP_SECRET}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    <<: *hardening
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # Раньше том был :ro — api только отдавал вложения. С появлением
    # отправки файлов оператором api пишет в него так же, как воркер:
    # файл сохраняется в момент отправки, ДО постановки в очередь,
    # иначе воркер получил бы задачу со ссылкой на несуществующий файл.
    volumes:
      - mediadata:/data/media
    environment:
      <<: *app-env
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY не задан}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://api.telegram.org}
      ZOHO_WIDGET_SHARED_SECRET: ${ZOHO_WIDGET_SHARED_SECRET}
      # Почта для кодов входа. Пусто — коды пишутся в лог api:
      # локально это удобно, на боевом сервере недопустимо.
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:-OmniDesk <no-reply@localhost>}
      APP_NAME: ${APP_NAME:-OmniDesk}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Масштабируется горизонтально: docker compose up -d --scale workers=3
  workers:
    build: { context: ., dockerfile: apps/workers/Dockerfile }
    <<: *hardening
    # edge обязателен: воркер отправляет сообщения и сам ходит в API
    # мессенджеров. Сеть internal помечена internal:true — из неё нет
    # выхода наружу, и отправка падала бы с невнятным «fetch failed».
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    volumes:
      - mediadata:/data/media
    environment:
      <<: *app-env
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://api.telegram.org}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Приём Telegram без вебхуков: сервис сам опрашивает Telegram.
  # Нужен там, где нет публичного адреса — на машине разработчика
  # или когда туннель режет сеть.
  #
  #   docker compose --profile polling up -d poller
  #
  # ⚠️ Профиль polling и вебхуки взаимоисключающи. Poller при старте
  # снимает вебхук, поэтому при заданном PUBLIC_URL он откажется
  # запускаться — это защита от молчаливой остановки приёма сообщений.
  poller:
    build: { context: ., dockerfile: apps/poller/Dockerfile }
    <<: *hardening
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      <<: *app-env
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-https://api.telegram.org}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["polling"]

  # TLS + reverse proxy. НУЖЕН ТОЛЬКО при белом IP.
  # При Cloudflare Tunnel выключается: docker compose up -d --scale caddy=0
  caddy:
    image: caddy:2-alpine
    <<: *hardening
    networks: [edge]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    profiles: ["public"]

  # Публичный HTTPS без единого открытого порта.
  # Рекомендуемый вариант — и для локальной ВМ, и вообще.
  # Токен: Cloudflare Zero Trust → Networks → Tunnels → Create
  cloudflared:
    image: cloudflare/cloudflared:latest
    <<: *hardening
    networks: [edge]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles: ["tunnel"]
